  <title>EMICP — النموذج التفاعلي (ملف واحد · v54)</title>
  <style>
:root {
  --navy-950: #092f39;
  --navy-900: #103f4a;
  --navy-800: #185461;
  --teal-700: #0f766e;
  --teal-600: #14867d;
  --teal-100: #dff3ef;
  --blue-700: #1d5fae;
  --blue-100: #e8f1fb;
  --green-700: #176b45;
  --green-100: #e6f4ec;
  --amber-800: #815800;
  --amber-100: #fff2c6;
  --red-700: #a52b22;
  --red-100: #fde9e7;
  --slate-950: #17231f;
  --slate-700: #46564f;
  --slate-600: #62716b;
  --slate-300: #cbd7d2;
  --slate-200: #dce5e1;
  --slate-100: #edf2f0;
  --surface: #ffffff;
  --canvas: #f3f6f5;
  --shadow-sm: 0 3px 12px rgba(18, 50, 41, .06);
  --shadow-lg: 0 24px 70px rgba(9, 42, 35, .22);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--slate-950);
  background: var(--canvas);
  font-family: Tahoma, "Segoe UI", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.6;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
a { color: inherit; }
:focus-visible { outline: 3px solid rgba(29, 95, 174, .3); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

.skip-link {
  position: fixed;
  z-index: 200;
  top: 8px;
  right: 8px;
  padding: 8px 12px;
  color: #fff;
  background: var(--blue-700);
  border-radius: var(--radius-sm);
  transform: translateY(-160%);
}
.skip-link:focus { transform: translateY(0); }

.login {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(380px, .85fr);
  background: var(--surface);
}
.login-copy {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(32px, 7vw, 96px);
  color: #fff;
  background: var(--navy-950);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 8px;
  background: rgba(255,255,255,.08);
  font-weight: 900;
  letter-spacing: .04em;
}
.brand strong { display: block; font-size: 17px; }
.brand small { display: block; color: rgba(255,255,255,.62); font-size: 10px; letter-spacing: .08em; }
.login-copy h1 { max-width: 760px; margin: 64px 0 16px; font-size: clamp(36px, 5vw, 68px); line-height: 1.1; }
.login-copy > p { max-width: 720px; margin: 0; color: rgba(255,255,255,.72); font-size: 16px; }
.login-flow { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 36px; }
.login-flow span { padding: 6px 9px; border: 1px solid rgba(255,255,255,.12); border-radius: var(--radius-sm); background: rgba(255,255,255,.06); color: #d8f4ee; font-size: 10px; }
.login-flow b { color: #62c9bb; }
.login-panel { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
.login-card { width: min(100%, 430px); }
.eyebrow { display: block; margin-bottom: 4px; color: var(--teal-700); font-size: 10px; font-weight: 900; letter-spacing: .06em; }
.login-card h2 { margin: 0 0 6px; font-size: 30px; }
.login-card > p { margin: 0 0 28px; color: var(--slate-600); font-size: 13px; }
.prototype-note { margin-top: 16px; padding: 12px; border-right: 3px solid var(--teal-700); background: var(--teal-100); border-radius: var(--radius-sm); color: var(--slate-700); font-size: 10px; }

.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { color: #35443e; font-size: 11px; font-weight: 900; }
.field small { color: var(--slate-600); font-size: 9px; }
.input, .select, .textarea {
  width: 100%;
  min-height: 44px;
  padding: 9px 11px;
  border: 1px solid var(--slate-300);
  border-radius: 7px;
  color: var(--slate-950);
  background: var(--surface);
}
.textarea { min-height: 92px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--teal-700); outline: 0; box-shadow: 0 0 0 3px rgba(15, 118, 110, .1); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.field.full { grid-column: 1 / -1; }
.form-note { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--slate-100); color: var(--slate-700); font-size: 10px; }
.form-note.locked { border-right: 3px solid var(--amber-800); background: var(--amber-100); }
.form-error { grid-column: 1 / -1; padding: 11px 13px; border: 1px solid #efb3b3; border-radius: var(--radius-sm); background: #fff1f1; color: #9a2424; font-size: 12px; font-weight: 700; }
.form-error:empty { display: none; }

.btn {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 13px;
  border: 1px solid transparent;
  border-radius: 7px;
  font-weight: 900;
  font-size: 11px;
}
.btn-primary { color: #fff; background: var(--teal-700); }
.btn-primary:hover { background: #0b625c; }
.btn-secondary { color: #31423b; background: #fff; border-color: var(--slate-300); }
.btn-secondary:hover { background: var(--slate-100); }
.btn-danger { color: var(--red-700); background: #fff; border-color: #e7b6b1; }
.btn-soft { color: var(--teal-700); background: var(--teal-100); }
.btn-sm { min-height: 32px; padding: 5px 9px; font-size: 9px; }
.btn-block { width: 100%; min-height: 48px; }
.button-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.file-button { position: relative; overflow: hidden; cursor: pointer; }
.file-button input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.file-button:focus-within { outline: 3px solid rgba(29, 95, 174, .3); outline-offset: 2px; }
.code-input, .code-chip { direction: ltr; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: .03em; }
.code-chip { display: inline-flex; padding: 2px 6px; border: 1px solid #b9d8d1; border-radius: 5px; color: var(--teal-700); background: var(--teal-100); font-size: 9px; white-space: nowrap; }

.app { min-height: 100vh; }
.topbar { position: sticky; z-index: 40; top: 0; color: #fff; background: var(--navy-900); box-shadow: 0 5px 18px rgba(11,40,48,.15); }
.topbar-main { min-height: 66px; max-width: 1500px; display: flex; align-items: center; gap: 16px; margin: 0 auto; padding: 10px 24px; }
.topbar .brand-mark { width: 38px; height: 38px; }
.topbar .brand strong { font-size: 14px; }
.role-tools { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
.role-tools label { color: rgba(255,255,255,.66); font-size: 9px; }
.role-switch { min-height: 38px; padding: 6px 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 7px; color: #fff; background: rgba(255,255,255,.08); font-size: 10px; }
.role-switch option { color: #111; background: #fff; }
.top-help { min-height: 38px; padding: 6px 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 7px; color: #fff; background: rgba(255,255,255,.06); font-size: 9px; font-weight: 900; }
.top-help:hover { background: rgba(255,255,255,.13); }
.top-help.danger { color: #ffd8d3; }
.top-icon { width: 38px; height: 38px; border: 1px solid rgba(255,255,255,.16); border-radius: 7px; color: #fff; background: rgba(255,255,255,.06); font-weight: 900; }
.nav { max-width: 1500px; display: flex; gap: 4px; margin: 0 auto; padding: 0 24px 8px; overflow-x: auto; }
.nav button { min-height: 35px; padding: 6px 12px; border: 0; border-radius: 6px; color: #b9cdd1; background: transparent; white-space: nowrap; font-size: 10px; font-weight: 900; }
.nav button:hover { color: #fff; background: rgba(255,255,255,.06); }
.nav button.active { color: #fff; background: var(--teal-700); }

.main { padding: 24px 24px 48px; }
.page { max-width: 1450px; margin: 0 auto; }
.page-head { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 18px; }
.page-head h1 { margin: 0; font-size: clamp(23px, 2.5vw, 34px); line-height: 1.25; }
.page-head p { max-width: 850px; margin: 5px 0 0; color: var(--slate-600); font-size: 12px; }
.page-actions { margin-inline-start: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.role-boundary { margin-bottom: 14px; padding: 11px 13px; border-right: 4px solid var(--teal-700); border-radius: var(--radius-sm); background: var(--teal-100); color: #31544d; font-size: 10px; }
.role-boundary strong { color: var(--navy-900); }

.journey-card { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 16px; margin-bottom: 14px; padding: 15px; border: 1px solid #a9d1c7; border-radius: var(--radius-md); background: #f6fffc; box-shadow: var(--shadow-sm); }
.journey-step { width: 70px; min-height: 70px; display: grid; place-items: center; align-content: center; border-radius: 9px; color: #fff; background: var(--navy-900); text-align: center; }
.journey-step span { font-size: 8px; }
.journey-step strong { font-size: 25px; line-height: 1.1; }
.journey-copy small { color: var(--teal-700); font-size: 9px; font-weight: 900; }
.journey-copy h2 { margin: 1px 0; font-size: 16px; }
.journey-copy p { margin: 0; color: var(--slate-600); font-size: 10px; }
.journey-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }

.setup-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-bottom: 12px; }
.setup-card { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; align-items: center; gap: 14px; padding: 16px; border: 1px solid var(--slate-200); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm); }
.setup-number { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px; color: #fff; background: var(--navy-900); font-size: 16px; font-weight: 900; }
.setup-card h2 { margin: 0; font-size: 15px; }
.setup-card p { margin: 3px 0 0; color: var(--slate-600); font-size: 9px; }
.setup-meta { margin-top: 8px; }
.readiness-line { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.readiness-line > span:not(.status) { color: var(--slate-600); font-size: 10px; }
.readiness-line > strong { margin-inline-start: auto; font-size: 11px; }

.grid { display: grid; gap: 12px; }
.summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 14px; }
.summary { min-height: 108px; padding: 15px; border: 1px solid var(--slate-200); border-radius: var(--radius-md); background: var(--surface); }
.summary-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--slate-600); font-size: 10px; }
.summary-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--teal-700); background: var(--teal-100); font-weight: 900; }
.summary.red .summary-icon { color: var(--red-700); background: var(--red-100); }
.summary.amber .summary-icon { color: var(--amber-800); background: var(--amber-100); }
.summary.blue .summary-icon { color: var(--blue-700); background: var(--blue-100); }
.summary strong { display: block; margin-top: 7px; font-size: 25px; line-height: 1.2; }
.summary small { color: var(--slate-600); font-size: 9px; }

.card { border: 1px solid var(--slate-200); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm); }
.card + .card { margin-top: 12px; }
.card-head { min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-bottom: 1px solid var(--slate-200); }
.card-head h2, .card-head h3 { margin: 0; font-size: 14px; }
.card-head p { margin: 2px 0 0; color: var(--slate-600); font-size: 9px; }
.card-head > :last-child:not(:first-child) { margin-inline-start: auto; }
.card-body { padding: 15px; }
.two-col { grid-template-columns: minmax(0, 1.4fr) minmax(300px, .8fr); align-items: start; }
.three-col { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.status { display: inline-flex; align-items: center; gap: 5px; min-height: 23px; padding: 3px 8px; border-radius: 999px; color: var(--blue-700); background: var(--blue-100); white-space: nowrap; font-size: 9px; font-weight: 900; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status.green { color: var(--green-700); background: var(--green-100); }
.status.amber { color: var(--amber-800); background: var(--amber-100); }
.status.red { color: var(--red-700); background: var(--red-100); }
.status.gray { color: #53615c; background: var(--slate-100); }

.list { display: grid; gap: 8px; }
.list-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--slate-200); border-radius: 8px; background: #fff; }
.list-item h3 { margin: 0; font-size: 11px; }
.list-item p { margin: 3px 0 0; color: var(--slate-600); font-size: 9px; }
.list-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; color: var(--slate-600); font-size: 8px; }
.step-date { display: inline-flex; align-items: center; gap: 3px; padding: 3px 6px; border: 1px solid #cce3df; border-radius: 999px; background: #f1faf8; color: #285f61; }
.step-date b { color: #174e52; }
.step-date time { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.list-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.finance-case-list { display: grid; gap: 14px; }
.finance-case { overflow: hidden; border: 1px solid var(--slate-200); border-radius: 10px; background: #fff; }
.finance-case-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px; border-bottom: 1px solid var(--slate-200); background: #f8fbfa; }
.finance-case-head h3 { margin: 3px 0 0; font-size: 13px; }
.finance-case-head p { margin: 3px 0 0; color: var(--slate-600); font-size: 9px; }
.finance-context-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px; }
.finance-context { padding: 12px; border: 1px solid var(--slate-200); border-radius: 8px; background: #fff; }
.finance-context h4 { margin: 4px 0 10px; font-size: 11px; }
.finance-detail-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; }
.finance-detail-list span { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-bottom: 5px; border-bottom: 1px dashed var(--slate-200); font-size: 8px; }
.finance-detail-list b { color: var(--slate-600); font-weight: 700; }
.finance-detail-list strong { text-align: left; font-size: 9px; }
.muted { margin: 0; color: var(--slate-600); font-size: 9px; }
.empty { padding: 42px 20px; text-align: center; color: var(--slate-600); }
.empty strong { display: block; color: var(--slate-950); font-size: 13px; }
.empty p { margin: 4px 0 0; font-size: 10px; }
.empty-action { display: flex; justify-content: center; margin-top: 13px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; min-width: 780px; border-collapse: collapse; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--slate-200); text-align: right; vertical-align: top; font-size: 9px; }
th { color: #e8f2f1; background: var(--navy-900); font-size: 9px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #f9fbfa; }
td strong { font-size: 10px; }
.number { direction: ltr; display: inline-block; font-variant-numeric: tabular-nums; }
.read-only { color: var(--blue-700); font-weight: 900; }
.denied { color: var(--red-700); font-weight: 900; }
.rm-stock-table table { min-width: 1120px; }
.required-qty-cell { min-width: 125px; white-space: nowrap; background: #f2fbf8; }
.required-qty-cell strong { padding: 4px 7px; border: 1px solid #a9d7cc; border-radius: 6px; color: var(--teal-700); background: var(--teal-100); font-size: 12px; font-weight: 900; }
.required-qty-cell span { margin-inline-start: 5px; color: var(--slate-950); font-weight: 800; }
.required-qty-cell small { display: block; margin-top: 6px; color: var(--slate-600); font-size: 8px; }
.need-date { direction: ltr; unicode-bidi: isolate; display: inline-block; min-width: 76px; color: var(--navy-900); font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
.quality-pipeline-table table { min-width: 900px; }
.quality-pipeline-table tbody tr td:first-child { direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.quality-pipeline-table tbody tr td:nth-child(4) strong { color: var(--navy-900); }
.quality-pipeline-table tbody tr td:nth-child(4) small { color: var(--slate-600); }

.forecast-list { display: grid; gap: 12px; }
.forecast-document { overflow: hidden; border: 1px solid var(--slate-200); border-radius: 9px; background: #fff; }
.forecast-document > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--slate-200); background: #fafcfc; }
.forecast-document h3 { margin: 0; font-size: 12px; }
.forecast-doc-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.forecast-doc-meta strong { font-size: 9px; }.forecast-doc-meta > b { min-width: 72px; text-align: left; font-size: 14px; }
.forecast-products { display: grid; gap: 0; }
.forecast-product { display: grid; grid-template-columns: 110px minmax(0,1fr) 110px; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--slate-100); }
.forecast-product:last-child { border-bottom: 0; }
.forecast-product span { font-size: 10px; }.forecast-product b { text-align: left; font-size: 11px; }
.forecast-document > footer { display: flex; flex-wrap: wrap; gap: 14px; padding: 9px 14px; border-top: 1px solid var(--slate-200); color: var(--slate-600); background: #fafcfc; font-size: 8px; }
.bulk-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; padding: 11px; border: 1px solid var(--slate-200); border-radius: 8px; background: #fafcfc; }
.bulk-tools > div:first-child { margin-inline-end: auto; }
.bulk-tools strong { display: block; font-size: 11px; }.bulk-tools p { margin: 1px 0 0; color: var(--slate-600); font-size: 8px; }
.forecast-lines { display: grid; gap: 8px; margin-bottom: 12px; }
.forecast-line { display: grid; grid-template-columns: minmax(220px,1.5fr) minmax(120px,.7fr) minmax(170px,1fr) 36px; align-items: end; gap: 9px; padding: 10px; border: 1px solid var(--slate-200); border-radius: 8px; background: #fff; }
.forecast-line .field { margin: 0; }
.line-remove { width: 36px; height: 44px; border: 1px solid #e7b6b1; border-radius: 7px; color: var(--red-700); background: var(--red-100); font-size: 17px; }

.workflow { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(145px, 1fr); gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.workflow-step { position: relative; min-height: 130px; padding: 13px; border: 1px solid var(--slate-200); border-radius: 9px; background: #fff; text-align: right; }
.workflow-step:not(:last-child)::after { content: "←"; position: absolute; top: 52px; left: -13px; z-index: 2; color: var(--teal-700); font-size: 20px; font-weight: 900; }
.workflow-step span { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 6px; color: #fff; background: var(--navy-900); font-size: 9px; font-weight: 900; }
.workflow-step strong { display: block; margin-top: 8px; font-size: 11px; }
.workflow-step p { margin: 4px 0 0; color: var(--slate-600); font-size: 8px; }
.workflow-step.highlight { border-color: #8bc7b9; background: var(--teal-100); }
.workflow-step.risk { border-color: #e2aaa4; background: var(--red-100); }

.metric-list { display: grid; gap: 9px; }
.metric { display: grid; grid-template-columns: 145px 1fr 44px; align-items: center; gap: 10px; }
.metric strong { font-size: 10px; }.metric b { font-size: 9px; text-align: left; }
.progress { height: 8px; overflow: hidden; border-radius: 99px; background: var(--slate-100); }
.progress i { display: block; height: 100%; background: var(--teal-700); }
.progress.amber i { background: #bd850b; }.progress.red i { background: var(--red-700); }

  .page-actions { margin-inline-start: 0; }
  .permission-grid, .three-col { grid-template-columns: 1fr; }
  .finance-context-grid { grid-template-columns: 1fr; }
  .setup-grid { grid-template-columns: 1fr; }
  .plan-table-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metric { grid-template-columns: 110px 1fr 40px; }
  .audit-item { grid-template-columns: 78px minmax(0,1fr); }
  .audit-item span { grid-column: 1 / -1; }
  .executive-filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .executive-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .executive-order > header { flex-direction: column; }
  .order-head-status { justify-items: start; text-align: right; }
  .roadmap-dialog-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 520px) {
  .summary-grid, .facts, .form-grid, .question-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
  .list-item { grid-template-columns: 1fr; }
  .finance-case-head { align-items: flex-start; flex-direction: column; }
  .finance-detail-list { grid-template-columns: 1fr; }
  .issue { grid-template-columns: 5px minmax(0,1fr); }
  .issue .list-actions { grid-column: 2; }
  .brand small { display: none; }
  .topbar .brand > div:last-child { display: none; }
  .topbar-main { gap: 8px; }
  .role-tools { gap: 5px; }
  .role-switch { max-width: 126px; }
  .top-help { font-size: 0; width: 36px; padding: 0; }
  .top-help[data-action="guide"]::after { content: "?"; font-size: 13px; }
  .top-help[data-action="reset"]::after { content: "↻"; font-size: 14px; }
  .journey-card { grid-template-columns: 58px minmax(0,1fr); gap: 11px; }
  .journey-step { width: 58px; min-height: 58px; }
  .journey-actions { grid-column: 1 / -1; justify-content: stretch; }
  .journey-actions .btn { flex: 1; }
  .guide-list { grid-template-columns: 1fr; }
  .setup-card { grid-template-columns: 42px minmax(0,1fr); }
  .setup-card > .btn { grid-column: 1 / -1; }
  .forecast-document > header { align-items: flex-start; flex-direction: column; }
  .forecast-product { grid-template-columns: 90px minmax(0,1fr); }
  .forecast-product b { grid-column: 2; text-align: right; }
  .forecast-line { grid-template-columns: 1fr 36px; }
  .forecast-line .field { grid-column: 1 / -1; }
  .forecast-line .line-remove { grid-column: 2; grid-row: 1; }
  .dialog-body { padding: 16px; }
  .plan-table-summary { grid-template-columns: 1fr; }
  .executive-filter-grid, .executive-kpi-grid, .roadmap-dialog-summary { grid-template-columns: 1fr; }
  .executive-search { grid-column: auto; }
  .order-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .order-progress-metric { grid-column: 1 / -1; }
  .executive-order > footer, .executive-section-head, .executive-filter-head { align-items: flex-start; flex-direction: column; }
  .executive-order > footer .btn { width: 100%; }
  .roadmap-detail-step { grid-template-columns: 30px minmax(0, 1fr); }
  .roadmap-detail-step time { grid-column: 2; text-align: right; }
  .roadmap-current-banner, .roadmap-dialog-live { grid-template-columns: 22px minmax(0, 1fr); }
  .roadmap-current-banner time, .roadmap-dialog-live time { grid-column: 2; }
  .roadmap-node { flex-basis: 112px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

@media print {
  .topbar, .page-actions, .btn, .skip-link, .toast-region { display: none !important; }
  body { background: #fff; }
  .main { padding: 0; }
  .page { max-width: none; }
  .card, .summary { box-shadow: none; break-inside: avoid; }
}

/* جدول احتياجات المواد متعدد المنتجات */
.material-plan-section { margin-bottom: 14px; }
.material-plan-section + .material-plan-section { margin-top: 22px; border-top: 1px solid rgba(16, 63, 74, 0.12); padding-top: 18px; }

/* جداول طلبات المواد والالتزامات */
.table-wrap .step-date { display: block; white-space: nowrap; }
.requirements-table table, .commitments-table table { min-width: 980px; }
.req-po { white-space: nowrap; }

/* قائمة كل المستحقات في بطاقة الخطوة */
.journey-list{background:#fff;border:1px solid var(--line,#dbe7e9);border-radius:12px;padding:12px 16px;margin:10px 0 18px}
.journey-list>small{color:#4b6a72;font-weight:700}
.journey-list-items{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.journey-list-item{display:flex;align-items:center;gap:8px;border:1px solid #dbe7e9;background:#f7fafa;border-radius:10px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:13.5px}
.journey-list-item b{background:#103f4a;color:#fff;border-radius:50%;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.journey-list-item small{color:#4b6a72}
.journey-list-item:hover{border-color:#103f4a}
.journey-count{background:#fff4d6;color:#8a6100;border-radius:12px;padding:1px 8px;font-weight:700}

/* وحدات مؤشرات الطلبية وخانة تأكيد الرصيد */
.order-metrics .metric-unit{font-style:normal;font-size:11px;color:#5a7d85;font-weight:600}
.stock-confirm-cell{text-align:center}
.stock-confirm-cell input{width:18px;height:18px;accent-color:#103f4a;cursor:pointer}

/* إشعارات المهام الوامضة */
@keyframes emicpBlink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.notify-box{display:inline-flex;align-items:center;gap:8px;background:#fff4d6;color:#6b4e00;border:1.5px solid #e6c96a;border-radius:10px;padding:6px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;animation:emicpBlink 1.4s ease-in-out infinite}
.notify-box:hover{animation-play-state:paused;border-color:#b98900}
.notify-box b{font-size:15px}
.notify-pulse{width:10px;height:10px;border-radius:50%;background:#e04f3f;display:inline-block;flex:none}
.nav .nav-task-dot{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:10px;background:#e04f3f;color:#fff;font-size:11px;font-weight:800;margin-inline-start:6px;padding:0 5px;animation:emicpBlink 1.4s ease-in-out infinite;vertical-align:middle}
@media (prefers-reduced-motion: reduce){ .notify-box, .nav .nav-task-dot { animation: none; } }

/* ===== Schema 13: جداول الأشهر ===== */
.forecast-monthly-table { min-width: 640px; }
.forecast-monthly-table th.month-col,
.plan-entry-table th.month-col { min-width: 92px; white-space: nowrap; font-size: 0.78rem; }
.forecast-grid-table table { min-width: 720px; }
.forecast-grid-table .month-qty-input,
.plan-entry-table .month-qty-input { min-width: 76px; text-align: center; }
.forecast-history-entry { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--line, #d8dee9); }
.forecast-history-entry .list-meta { margin-bottom: 6px; }
.forecast-document footer .list-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* ===== Schema 14: الخطة الأسبوعية والمبيعات ===== */
.week-frozen { color: var(--danger, #c0392b); font-weight: 700; }

/* ===== داشبورد الإدارة: مخططات تفاعلية ===== */
.exec-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 18px; }
.chart-panel { display: flex; flex-direction: column; gap: 10px; }
.chart-panel-wide { grid-column: 1 / -1; }
.donut-wrap { display: flex; justify-content: center; }
.donut-wrap svg { width: min(240px, 100%); height: auto; }
.line-wrap svg { width: 100%; height: auto; }
.donut-seg { cursor: pointer; transition: opacity .15s ease, transform .15s ease; transform-box: fill-box; transform-origin: center; stroke: var(--surface, #fff); stroke-width: 2; }
.donut-seg:hover, .donut-seg:focus-visible { opacity: .82; transform: scale(1.03); outline: none; }
.donut-seg.active { stroke: #0f172a; stroke-width: 2.5; }
.donut-center-value { font-size: 26px; font-weight: 800; fill: #0f172a; }
.donut-center-label { font-size: 12px; fill: #64748b; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 8px; }
.legend-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line, #d8dee9); background: transparent; border-radius: 999px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: .8rem; color: inherit; }
.legend-chip:hover { border-color: #94a3b8; }
.legend-chip.active { border-color: #0f172a; box-shadow: 0 0 0 1px #0f172a inset; }
.legend-chip.muted { opacity: .45; }
.legend-chip.muted .legend-swatch { background: #cbd5e1 !important; }
.legend-swatch { width: 12px; height: 12px; border-radius: 4px; display: inline-block; flex: none; }
.chart-grid { stroke: #e2e8f0; stroke-width: 1; }
.chart-axis { font-size: 11px; fill: #64748b; }
.line-label { font-size: 12px; font-weight: 700; fill: #334155; }
.line-pt { cursor: pointer; transition: transform .12s ease; transform-box: fill-box; transform-origin: center; stroke: #fff; stroke-width: 1.5; }
.line-pt:hover { transform: scale(1.5); }
.chart-hint { font-size: .75rem; color: #64748b; margin: 0; }
.chart-empty { padding: 28px 12px; text-align: center; color: #64748b; border: 1px dashed var(--line, #d8dee9); border-radius: 12px; }
.chart-tooltip { position: fixed; display: none; z-index: 999; background: #0f172a; color: #f8fafc; padding: 6px 10px; border-radius: 8px; font-size: .78rem; pointer-events: none; max-width: 240px; box-shadow: 0 6px 18px rgba(15, 23, 42, .25); }
@media (prefers-reduced-motion: reduce) {
  .donut-seg, .line-pt { transition: none; }
  .donut-seg:hover { transform: none; }
  .line-pt:hover { transform: none; }
}

/* نظام التقارير */
.report-filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; }
.report-filters label { display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: var(--slate-700); font-weight: 700; }
.report-filters select { min-width: 180px; }

/* نظام اللغات */
.lang-switch { min-width: 130px; }
.lang-table td { padding: 4px 6px; }
.lang-cell { width: 100%; min-width: 180px; font-size: 11px; }
[dir="ltr"] .page, [dir="ltr"] .topbar { text-align: left; }

/* المستخدمون والهوية */
.user-chip { padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-size: 10px; font-weight: 700; white-space: nowrap; }
.brand-logo { width: 44px; height: 44px; border-radius: var(--radius-sm); object-fit: contain; background: #fff; padding: 2px; }
.topbar .brand-logo { width: 38px; height: 38px; }
.branding-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.branding-logo-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#brand-color-input { width: 64px; height: 38px; padding: 2px; border: 1px solid var(--slate-300); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; }

/* داشبورد الإدارة: تخصيص اللوحة وKPI */
.exec-widget-picker { position: relative; display: inline-block; }
.exec-widget-menu { position: absolute; z-index: 60; top: calc(100% + 8px); inset-inline-end: 0; min-width: 280px; display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1px solid var(--slate-200); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-lg); text-align: start; }
.exec-widget-menu-head { display: flex; flex-direction: column; margin-bottom: 6px; }
.exec-widget-menu-head small { color: var(--slate-600); font-size: 10px; }
.exec-widget-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; }
.exec-widget-item:hover { background: var(--slate-100); }
.exec-widget-item input { accent-color: var(--teal-700); width: 15px; height: 15px; }
.exec-core-kpis { margin-bottom: 18px; }
.kpi-filter-tile { text-align: inherit; font: inherit; cursor: pointer; border: 1px solid var(--slate-200); transition: transform .12s ease, box-shadow .12s ease; }
.kpi-filter-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.kpi-filter-tile.is-active { border-color: var(--teal-700); box-shadow: 0 0 0 2px var(--teal-100); }
.exec-strategic { margin-top: 18px; }

/* منتجات المستند المرجعية داخل نافذة الاحتياجات */
.material-products-ref { margin: 12px 0; padding: 10px 12px; border: 1px solid var(--slate-200); border-radius: var(--radius-md); background: var(--slate-100); }
.material-products-ref > summary { cursor: pointer; font-size: 12px; padding: 2px 0; }
.material-products-ref > summary::marker { color: var(--teal-700); }
.material-products-ref .table-wrap { margin-top: 10px; background: var(--surface); border-radius: var(--radius-sm); }
.ref-total-row td { background: var(--teal-100); }
.ref-total-row th { background: var(--teal-100); }
.tone-amber { color: #a8641b; }
.material-products-ref > small { display: block; margin: 4px 0 8px; }

/* ===== شريط فلاتر الجداول (v45) ===== */
.table-toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; margin: 0 0 10px; padding: 10px 12px; background: var(--slate-100); border: 1px solid var(--slate-200); border-radius: var(--radius-md); }
.table-filter-field { display: grid; gap: 3px; min-width: 150px; }
.table-filter-field.grow { flex: 1 1 220px; }
.table-filter-field > span { font-size: 10px; font-weight: 600; color: var(--slate-600, #5a6b7a); }
.table-filter-field .input, .table-filter-field .select { padding: 5px 8px; font-size: 11px; }
.table-count { margin-inline-start: auto; font-size: 11px; font-weight: 600; color: var(--navy-800); white-space: nowrap; font-variant-numeric: tabular-nums; }
.table-empty { margin-top: 8px; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { text-decoration: underline; }
th.sortable.sort-asc::after { content: " ▲"; font-size: 8px; }
th.sortable.sort-desc::after { content: " ▼"; font-size: 8px; }
@media print { .table-toolbar { display: none !important; } }


/* v49: شريط الأوامر الجماعية في نافذة تقسيم الأسابيع */
.bulk-tools.bulk-apply { flex-wrap: wrap; align-items: flex-end; gap: 10px; }
.bulk-tools.bulk-apply > div:first-child { flex: 1 1 100%; }
.bulk-tools.bulk-apply .table-filter-field { min-width: 190px; }
.bulk-sep { flex: 1 1 auto; }
.plan-entry-table tbody tr.row-picked { background: rgba(16, 63, 74, 0.05); }
.plan-entry-table tbody tr.row-picked > td:first-child { box-shadow: inset 3px 0 0 var(--brand, #103f4a); }
.plan-entry-table input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--brand, #103f4a); cursor: pointer; }

/* v50: صندوق الموافقات — الموافقة بالاستثناء */
.row-exception { background: rgba(214, 158, 46, 0.10); }
.row-exception > td:first-child { box-shadow: inset 3px 0 0 #d69e2e; }

/* v52: صف تشغيل مكتمل داخل نافذة Production Actual */
.plan-entry-table tbody tr.row-done { background: rgba(47, 133, 90, 0.07); }
.plan-entry-table tbody tr.row-done .input:disabled { background: transparent; border-style: dashed; opacity: 0.7; }

/* v53: سطر الحل داخل بطاقة القضية */
.issue-resolution { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: rgba(47, 133, 90, 0.08); font-size: 0.86rem; }
.issue-resolution > strong { color: #2f855a; }
.issue-resolution.pending { background: rgba(49, 130, 206, 0.10); }
.issue-resolution.pending > strong { color: #2b6cb0; }

"الحدّ لا يعتمد شيئًا نيابة عن أحد — يقرر فقط ما يأتي محددًا مسبقًا. كل موافقة تبقى باسم صاحبها في سجل الأحداث. الصفر يعني: لا يمرّ إلا المطابق تمامًا.": ["The limit approves nothing on anyone's behalf — it only decides what arrives pre-selected. Every approval stays in its owner's name in the event log. Zero means only an exact match passes.", "سنوورەکە هیچ شتێک لە جیاتی کەس پەسەند ناکات — تەنها بڕیار دەدات چی پێشوەخت دیاریکراو دێت. هەموو پەسەندکردنێک بە ناوی خاوەنەکەی دەمێنێتەوە لە تۆماری ڕووداوەکاندا. سفر واتە تەنها ئەوەی تەواو دەگونجێت تێدەپەڕێت."],

          survivor.monthlyQty[month] = Number(survivor.monthlyQty[month] || 0) + Number(item.monthlyQty[month] || 0);
        });
        if (item.stockConfirmed && !survivor.stockConfirmed) {
          survivor.stockConfirmed = true;
          survivor.stockConfirmedAt = item.stockConfirmedAt;
          survivor.onHand = item.onHand; survivor.reserved = item.reserved; survivor.hold = item.hold;
        } else if (item.stockConfirmed && survivor.stockConfirmed) {
          // كلا السجلين مؤكد: الرصيد الفيزيائي واحد، فنحتفظ بالأعلى بدل رمي رصيد استلام سبق ترحيله في v11.
          survivor.onHand = Math.max(Number(survivor.onHand || 0), Number(item.onHand || 0));
          survivor.reserved = Math.max(Number(survivor.reserved || 0), Number(item.reserved || 0));
          survivor.hold = Math.max(Number(survivor.hold || 0), Number(item.hold || 0));
        }
        survivor.productionApproved = Boolean(survivor.productionApproved && item.productionApproved);
        if (String(item.needDate || "9999") < String(survivor.needDate || "9999")) survivor.needDate = item.needDate;
        result.commitments.forEach(function (record) { if (record.materialId === item.id) record.materialId = survivor.id; });
      });
      result.materials = mergedMaterials;
    }
    // v18: موافقة المالية على أوامر الشراء — الأوامر القديمة تعتبر موافقًا عليها ترحيلًا.
    result.commitments.forEach(function (item) {
      if (!item.financeApproval || typeof item.financeApproval !== "object") {
        item.financeApproval = savedSchemaVersion > 0 && savedSchemaVersion < 18
          ? { status: "approved", note: "أمر سابق لاعتماد موافقة المالية", at: item.createdAt || "" }
          : { status: "pending", note: "", at: "" };
      }
    });
    result.actuals.forEach(function (item) {
      if (!item.forecastId && item.planId) {
        var actPlan = result.plans.find(function (plan) { return plan.id === item.planId; });
        if (actPlan) { item.forecastId = actPlan.forecastId; item.productCode = normalizeCode(actPlan.productCode); }
      }
      if (!item.month) item.month = monthKeyOf(item.date) || "";
    });
    // ===== تطبيع نهائي بعد كل الترحيلات =====
    // كان حقل رقمي مفقود يُنتج NaN يظهر «0» في الواجهة، فيختفي النقص ويختفي المتاح للبيع.
    // ويُوحَّد كود المادة هنا لمرة واحدة لأن كل القراء يقارنون بكود مُطبَّع.
    function normalizeNumbers(list, keys) {
      (list || []).forEach(function (item) {
        keys.forEach(function (key) {
          var value = Number(item[key]);
          item[key] = Number.isFinite(value) ? value : 0;
        });
      });
    }
    result.materials.forEach(function (item) {
      item.materialCode = normalizeCode(item.materialCode);
      if (!item.monthlyQty || typeof item.monthlyQty !== "object") item.monthlyQty = {};
      Object.keys(item.monthlyQty).forEach(function (month) {
        var value = Number(item.monthlyQty[month]);
        item.monthlyQty[month] = Number.isFinite(value) ? value : 0;
      });
    });
    normalizeNumbers(result.materials, ["required", "consumed", "onHand", "reserved", "hold", "inbound"]);
    normalizeNumbers(result.fgReceipts, ["produced", "received", "reserved", "blocked"]);
    normalizeNumbers(result.actuals, ["planned", "actual"]);
    normalizeNumbers(result.salesRecords, ["qty"]);
    normalizeNumbers(result.rawReceipts, ["qty", "received"]);
    normalizeNumbers(result.commitments, ["qty"]);
    normalizeNumbers(result.materialMoves, ["qty"]);
    normalizeNumbers(result.wasteRecords, ["qty"]);
    (result.wasteRecords || []).forEach(function (item) { item.materialCode = normalizeCode(item.materialCode); });
    (result.materialMoves || []).forEach(function (item) { item.materialCode = normalizeCode(item.materialCode); });
    // Migration v23: صندوق الموافقات وحدّ التفويض. الحالات القديمة لا تحمل الشاشة ولا الحدّ.
    if (!Number.isFinite(Number(result.approvalTolerancePct)) || Number(result.approvalTolerancePct) < 0) result.approvalTolerancePct = 5;
    if (savedSchemaVersion > 0 && savedSchemaVersion < 23 && result.permissions) {
      [["sales", "workflow"], ["production", "workflow"], ["fgWarehouse", "workflow"], ["finance", "home"]].forEach(function (pair) {
        var list = result.permissions[pair[0]];
        if (!Array.isArray(list) || list.indexOf("approvals") !== -1) return;
        var at = list.indexOf(pair[1]);
        list.splice(at === -1 ? list.length : at + 1, 0, "approvals");
      });
    }
    // Migration v24: القضايا القديمة تحمل «department» باسم دور المُبلِّغ وحده، بلا سبب ولا حل.
    if (savedSchemaVersion > 0 && savedSchemaVersion < 24) {
      result.issues.forEach(function (item) {
        if (!item.raisedBy) item.raisedBy = item.department || "";
        if (!item.departmentRole) {
          var deptMatch = Object.keys(roles).filter(function (key) { return roles[key].name === item.department; })[0];
          item.departmentRole = deptMatch || "";
        }
        if (!item.raisedByRole) item.raisedByRole = item.departmentRole || "";
        ["rootCause", "resolution", "prevention", "closedBy", "resolvedBy", "resolvedAt"].forEach(function (key) { if (typeof item[key] !== "string") item[key] = ""; });
      });
    }
    result.schemaVersion = APP_SCHEMA_VERSION;
    return result;
  }

  function monthKeyOf(value) {
    var match = /^(\d{4})-(\d{2})/.exec(String(value || ""));
    return match ? match[1] + "-" + match[2] : "";
  }

  function monthsBetween(fromMonth, toMonth) {
    if (!/^\d{4}-\d{2}$/.test(fromMonth)) return [];
    if (!/^\d{4}-\d{2}$/.test(toMonth)) toMonth = fromMonth;
    var list = [];
    var year = Number(fromMonth.slice(0, 4)), month = Number(fromMonth.slice(5, 7));
    var endYear = Number(toMonth.slice(0, 4)), endMonth = Number(toMonth.slice(5, 7));
    while (year < endYear || (year === endYear && month <= endMonth)) {
      list.push(year + "-" + String(month).padStart(2, "0"));
      month += 1;
      if (month > 12) { month = 1; year += 1; }
      if (list.length >= 24) break;
    }
    return list;
  }

  function monthLabel(monthKey) {
    var names = { "01": "كانون الثاني", "02": "شباط", "03": "آذار", "04": "نيسان", "05": "أيار", "06": "حزيران", "07": "تموز", "08": "آب", "09": "أيلول", "10": "تشرين الأول", "11": "تشرين الثاني", "12": "كانون الأول" };
    var match = /^(\d{4})-(\d{2})$/.exec(String(monthKey || ""));
    return match ? (names[match[2]] || match[2]) + " " + match[1] : String(monthKey || "—");
  }

  function forecastStatusInfo(value) {
    var map = {
      submitted: ["عند الإنتاج — بانتظار الرد", "blue"],
      production_feedback: ["رد الإنتاج — عند المبيعات", "amber"],
      fixed: ["مثبت", "green"],
      cancelled: ["ملغي", "gray"]
    };
    return map[value] || [value || "—", "gray"];
  }

  function weeklyPlanStatusInfo(value) {
    var map = {
      awaiting_sales: ["عند المبيعات — بانتظار المراجعة", "blue"],
      awaiting_approvals: ["بانتظار اعتماد الإنتاج ومخزن FG", "amber"],
      approved: ["معتمدة", "green"]
    };
    return map[value] || [value || "—", "gray"];
  }

  function lastDayOfMonth(monthKey) {
    var match = /^(\d{4})-(\d{2})$/.exec(String(monthKey || ""));
    if (!match) return 28;
    return new Date(Number(match[1]), Number(match[2]), 0).getDate();
  }

  // أسابيع الشهر أربعة مقاطع ثابتة: 1-7، 8-14، 15-21، 22-نهاية الشهر.
  function weeksOfMonth(monthKey) {
    var last = lastDayOfMonth(monthKey);
    var segments = [[1, 7], [8, 14], [15, 21], [22, last]];
    return segments.map(function (seg, index) {
      var pad = function (n) { return String(n).padStart(2, "0"); };
      return {
        key: "W" + (index + 1),
        start: monthKey + "-" + pad(seg[0]),
        end: monthKey + "-" + pad(seg[1]),
        label: "الأسبوع " + (index + 1) + " (" + pad(seg[0]) + "–" + pad(seg[1]) + ")"
      };
    });
  }

  // قاعدة التجميد: لا تعديل داخل أسبوع الإنتاج؛ التعديل قبل بداية الأسبوع بيومين على الأقل.
  function weekEditable(week) {
    return String(week.start) >= dateDaysFromNow(2);
  }

  function weeklyPlanFor(forecastId, productCode, month) {
    return state.weeklyPlans.find(function (plan) {
      return plan.forecastId === forecastId && normalizeCode(plan.productCode) === normalizeCode(productCode) && plan.month === month;
    });
  }

  // أهداف التقسيم: كل (منتج × شهر) في مستند مثبت كميته > 0 وليس له خطة أسبوعية بعد.
  function pendingWeeklyPlanTargets() {
    var targets = [];
    state.forecasts.filter(function (item) { return item.status === "fixed"; }).forEach(function (forecast) {
      forecast.items.forEach(function (line) {
        forecast.months.forEach(function (month) {
          var qty = Number(line.monthlyQty[month] || 0);
          if (qty <= 0) return;
          if (!weeklyPlanFor(forecast.id, line.productCode, month)) {
            targets.push({ forecast: forecast, line: line, month: month, qty: qty });
          }
        });
      });
    });
    return targets;
  }

  // ===== صافي احتياج المنتج النهائي (MPS) =====
  // كانت خطة الإنتاج تساوي الفوركاست كاملًا فوق أي رصيد قائم: 3,000 في المخزن وفوركاست 10,000
  // يعني إنتاج 10,000 والصحيح 7,000. الآن يُخصم المتاح من أقرب الأشهر أولًا.
  function productionNetPlanFor(productCode) {
    var rows = [];
    state.forecasts.filter(function (item) { return item.status === "fixed"; }).forEach(function (forecast) {
      forecast.items.forEach(function (line) {
        if (normalizeCode(line.productCode) !== normalizeCode(productCode)) return;
        forecast.months.forEach(function (month) {
          var gross = Number(line.monthlyQty[month] || 0);
          if (gross <= 0) return;
          rows.push({
            forecastId: forecast.id, productCode: line.productCode, productName: line.productName,
            unit: line.unit || "", month: month, gross: gross,
            produced: producedQty(forecast.id, line.productCode, month)
          });
        });
      });
    });
    rows.sort(function (a, b) { return String(a.month).localeCompare(String(b.month)) || String(a.forecastId).localeCompare(String(b.forecastId)); });
    var pool = productNetAvailable(productCode);
    rows.forEach(function (row) {
      var open = Math.max(0, roundQty(row.gross - row.produced));
      var fromStock = Math.min(open, pool);
      pool = roundQty(pool - fromStock);
      row.fromStock = roundQty(fromStock);
      // الصافي هدف إنتاج، فيُقرَّب إلى كرتون كامل: لا خطة بنصف كرتون.
      row.net = planQty(open - fromStock);
    });
    return rows;
  }

  function productionNetNeed(forecastId, productCode, month) {
    var row = productionNetPlanFor(productCode).find(function (item) {
      return item.forecastId === forecastId && item.month === month;
    });
    return row ? row.net : 0;
  }

  function weeklyPlanFullyApproved(plan) {
    return plan.status === "approved";
  }

  // منع التجاوز: لا تنفيذ لشهر قبل اكتمال اعتماد خطته من الطرفين (كل الوحدات).
  function weeklyPlanApprovedFor(forecastId, productCode, month) {
    var plan = weeklyPlanFor(forecastId, productCode, month);
    return Boolean(plan && plan.status === "approved");
  }

  var GRANULARITY_LABELS = { monthly: "شهرية (كتلة واحدة)", weekly: "أسبوعية", daily: "يومية" };

  // وحدات الاعتماد حسب مرونة الخطة: الشهر كتلة، أو الأسابيع، أو الأيام الموزعة.
  function planUnits(plan) {
    var units = [];
    (plan.weeks || []).forEach(function (week) {
      var dayKeys = plan.granularity === "daily" ? Object.keys(week.days || {}).filter(function (key) { return Number(week.days[key]) > 0; }).sort() : [];
      if (dayKeys.length) {
        dayKeys.forEach(function (dateKey) { units.push({ key: dateKey, label: "يوم " + dateKey, qty: Number(week.days[dateKey]) }); });
      } else {
        units.push({ key: week.key, label: week.label, qty: Number(week.qty || 0) });
      }
    });
    return units;
  }

  function unitApprovedBy(plan, unitKey, roleKey) {
    return Boolean(plan.unitApprovals && plan.unitApprovals[unitKey] && plan.unitApprovals[unitKey][roleKey]);
  }

  function planApprovalProgress(plan, roleKey) {
    var units = planUnits(plan);
    var done = units.filter(function (unit) { return unitApprovedBy(plan, unit.key, roleKey); }).length;
    return { done: done, total: units.length };
  }

  function planFullyApprovedByRole(plan, roleKey) {
    var progress = planApprovalProgress(plan, roleKey);
    return progress.total > 0 && progress.done === progress.total;
  }

  function recomputePlanApproval(plan) {
    if (plan.status !== "awaiting_approvals") return;
    if (planFullyApprovedByRole(plan, "production") && planFullyApprovedByRole(plan, "fgWarehouse")) {
      plan.status = "approved";
      plan.approvedAt = currentTimestamp();
      plan.approvals = { production: { at: plan.approvedAt }, fgWarehouse: { at: plan.approvedAt } };
      addAudit("اكتمال اعتماد كل وحدات الخطة " + plan.id + " (الإنتاج + مخزن FG)", "EMICP");
    }
  }

  function approvePlanUnits(plan, roleKey, unitKeys) {
    var stamp = currentTimestamp();
    var count = 0;
    if (!plan.unitApprovals) plan.unitApprovals = {};
    unitKeys.forEach(function (unitKey) {
      if (!plan.unitApprovals[unitKey]) plan.unitApprovals[unitKey] = { production: null, fgWarehouse: null };
      if (!plan.unitApprovals[unitKey][roleKey]) { plan.unitApprovals[unitKey][roleKey] = stamp; count += 1; }
    });
    return count;
  }

  function productSoldQty(productCode) {
    return state.salesRecords.filter(function (item) { return normalizeCode(item.productCode) === normalizeCode(productCode); })
      .reduce(function (sum, item) { return sum + Number(item.qty || 0); }, 0);
  }

  function productNetAvailable(productCode) {
    var available = state.fgReceipts.filter(function (item) { return normalizeCode(item.productCode) === normalizeCode(productCode); })
      .reduce(function (sum, item) { return sum + fgAvailable(item); }, 0);
    return Math.max(0, available - productSoldQty(productCode));
  }

  // آخر رصيد فعلي معروف لكود المادة (من أحدث سجل مؤكد).
  function materialOnHandByCode(code) {
    var confirmed = state.materials.filter(function (item) { return normalizeCode(item.materialCode) === normalizeCode(code) && item.stockConfirmed; });
    if (!confirmed.length) return null;
    confirmed.sort(function (a, b) { return String(b.stockConfirmedAt || "").localeCompare(String(a.stockConfirmedAt || "")); });
    return Number(confirmed[0].onHand || 0);
  }

  // تنبيهات المخزون الاستراتيجي: مواد رصيدها المعروف تحت الحد الذي وضعه الإنتاج والمشتريات.
  function strategicAlerts() {
    return state.rawMaterials.filter(function (item) { return item.active !== false && item.strategicStock != null; }).map(function (item) {
      var onHand = materialOnHandByCode(item.code);
      return { master: item, onHand: onHand, gap: onHand == null ? null : Math.max(0, Number(item.strategicStock) - onHand) };
    }).filter(function (entry) { return entry.onHand != null && entry.onHand < Number(entry.master.strategicStock); });
  }

  // ===== التوالف (Schema 21): تخصم من الرصيد الفيزيائي وتظهر في الحركة والتقارير =====
  var WASTE_REASONS = { damage: "تلف", expiry: "انتهاء صلاحية", breakage: "كسر", loss: "فقد", quality: "رفض جودة", other: "أخرى" };

  function wasteReasonLabel(reason) {
    return WASTE_REASONS[reason] || WASTE_REASONS.other;
  }

  function wasteQtyForCode(code) {
    return (state.wasteRecords || []).filter(function (item) { return normalizeCode(item.materialCode) === normalizeCode(code); })
      .reduce(function (sum, item) { return sum + Number(item.qty || 0); }, 0);
  }

  function totalWasteQty() {
    return (state.wasteRecords || []).reduce(function (sum, item) { return sum + Number(item.qty || 0); }, 0);
  }

  function recordMaterialMove(type, master, qty, month, ref) {
    state.materialMoves.unshift({ id: createId("MV"), type: type, materialCode: master.materialCode || master.code, material: master.material || master.name, unit: master.unit || "", qty: Number(qty || 0), month: month || "", ref: ref || "", at: currentTimestamp() });
    if (state.materialMoves.length > 400) state.materialMoves = state.materialMoves.slice(0, 400);
  }

  function movesInMonth(code, month, type) {
    return state.materialMoves.filter(function (item) {
      return normalizeCode(item.materialCode) === normalizeCode(code) && item.month === month && item.type === type;
    }).reduce(function (sum, item) { return sum + Number(item.qty || 0); }, 0);
  }

  function soldInMonth(productCode, month) {
    return state.salesRecords.filter(function (item) {
      return normalizeCode(item.productCode) === normalizeCode(productCode) && monthKeyOf(item.date) === month;
    }).reduce(function (sum, item) { return sum + Number(item.qty || 0); }, 0);
  }

  function rawMasterByCode(code) {
    return state.rawMaterials.find(function (item) { return normalizeCode(item.code) === normalizeCode(code); });
  }

  function leadTimeBadge(materialCode) {
    var master = rawMasterByCode(materialCode);
    if (!master || master.leadTimeDays == null) return "";
    return '<br><small>مدة التوريد ~' + formatNumber(master.leadTimeDays) + ' يوم</small>';
  }

  // ===== وحدة الشراء ومدة التوريد =====
  // كانت كمية أمر الشراء تُرسل بوحدة الاستهلاك: نقص 5000 كغم يُطلب 5000 كيس.
  // الآن تُحسب بوحدة الشراء عبر معامل التحويل، ويُرفع الحد الأدنى للمورد، ويبقى المخزون بوحدة الاستهلاك.
  function purchasePlanFor(materialCode, shortage) {
    var master = rawMasterByCode(materialCode);
    var factor = master && Number(master.conversionFactor) > 0 ? Number(master.conversionFactor) : 1;
    var moq = master && Number(master.moq) > 0 ? Number(master.moq) : 0;
    var need = roundQty(Math.max(0, Number(shortage || 0)));
    var orderQty = factor > 1 ? Math.ceil(roundQty(need / factor)) : need;
    var moqApplied = false;
    if (moq > 0 && orderQty < moq) { orderQty = moq; moqApplied = true; }
    return {
      factor: factor,
      moq: moq,
      moqApplied: moqApplied,
      purchaseUnit: master && master.purchaseUnit ? master.purchaseUnit : "",
      orderQty: roundQty(orderQty),
      consumptionQty: roundQty(orderQty * factor)
    };
  }

  // آخر موعد لإصدار الأوردر حتى تصل المادة قبل تاريخ الحاجة.
  function latestOrderDate(materialCode, needDate) {
    var master = rawMasterByCode(materialCode);
    if (!master || master.leadTimeDays == null || !needDate) return "";
    return shiftDate(needDate, -Number(master.leadTimeDays));
  }

  // لا تُفقد بيانات بصمت: أي تلف في التخزين يُحفظ في مفتاح جانبي قبل العودة إلى حالة فارغة،
  // ويُرفع تنبيه ظاهر بدل أن يبتلعه catch كما كان.
  var storageAlert = null;

  function backupCorruptState(raw, error) {
    storageAlert = { kind: "corrupt", detail: String(error && error.message || error || "") };
    try {
      if (raw) window.localStorage.setItem(STORAGE_KEY + "-corrupt", raw);
    } catch (backupError) { /* تعذر حفظ النسخة الاحتياطية — التنبيه يبقى قائمًا */ }
  }

  function loadState() {
    var saved = null;
    try {
      saved = window.localStorage.getItem(STORAGE_KEY);
      if (!saved) return clone(defaultState);
      return normalizeLoadedState(JSON.parse(saved));
    } catch (error) {
      backupCorruptState(saved, error);
      return clone(defaultState);
    }
  }

  var state = loadState();
  var executiveFilters = { health: "all", stage: "all", product: "all", from: "", to: "", sort: "risk", query: "" };

  // فشل الحفظ لم يعد صامتًا: امتلاء مساحة المتصفح كان يُبتلع بينما تقول الواجهة «تم الحفظ».
  // ===== حفظ مؤجَّل للعمليات الجماعية =====
  // addAudit كان يحفظ الحالة كاملة بعد كل سطر، واعتماد الوحدات يضيف سطرًا ثانيًا عند اكتمال الخطة.
  // اعتماد مئة بند = نحو مئتَي تسلسل كامل للحالة (مستندات 139 منتجًا × 12 شهرًا وكل الخطط)
  // وكتابتها في localStorage قبل أن تظهر النتيجة — وهذا سبب تأخّر زر «اعتماد المحدد».
  // withBatchedSave يجمع كل ذلك في حفظة واحدة عند نهاية العملية.
  var deferSaveDepth = 0;

  function withBatchedSave(work) {
    deferSaveDepth += 1;
    var result;
    try {
      result = work();
    } finally {
      deferSaveDepth -= 1;
      if (deferSaveDepth === 0) saveState();
    }
    return result;
  }

  function saveState() {
    if (deferSaveDepth > 0) return true;
    state.schemaVersion = APP_SCHEMA_VERSION;
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (storageAlert && storageAlert.kind !== "corrupt") storageAlert = null;
      return true;
    } catch (error) {
      var quota = Boolean(error && (error.name === "QuotaExceededError" || error.name === "NS_ERROR_DOM_QUOTA_REACHED" || error.code === 22));
      storageAlert = { kind: quota ? "quota" : "save", detail: String(error && error.message || error || "") };
      showToast(quota
        ? "لم يُحفظ التغيير: مساحة المتصفح ممتلئة. احذف مرفقات كوتيشن قديمة أو صدّر البيانات قبل المتابعة."
        : "تعذر حفظ التغيير في هذا المتصفح؛ لا تغلق الصفحة قبل تصدير البيانات.", "error");
      return false;
    }
  }

  function syncStateFromStorage() {
    var currentView = { role: state.role, page: state.page, loggedIn: state.loggedIn, currentUserId: state.currentUserId };
    var latest = loadState();
    latest.role = currentView.role;
    latest.page = currentView.page;
    latest.loggedIn = currentView.loggedIn;
    latest.currentUserId = currentView.currentUserId;
    state = latest;
    if (!canAccess(state.page)) state.page = "home";
  }

  // إيقاف مستخدم أو حذفه كان لا يقطع جلسته: المزامنة كانت تُعيد فرض الجلسة القديمة فوق الحالة الجديدة.
  function sessionStillValid() {
    if (!state.loggedIn) return true;
    if (!state.currentUserId) return true;
    var user = state.users.find(function (item) { return item.id === state.currentUserId; });
    return Boolean(user && user.active !== false);
  }

  function endInvalidSession() {
    var wasUser = state.currentUserId;
    state.loggedIn = false;
    state.currentUserId = "";
    saveState();
    renderLogin();
    showToast(wasUser ? "أُنهيت جلستك: الحساب أُوقف أو حُذف من لوحة التحكم." : "أُنهيت الجلسة.", "error");
  }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // ===== المستخدمون والهوية: يديرهما مسؤول النظام (Schema 19) =====
  function seedDefaultUsers() {
    return Object.keys(roles).map(function (key) {
      return { id: "U-" + key, name: roles[key].name, role: key, active: true, createdAt: "" };
    });
  }

  // كلمة المرور تخزن كبصمة djb2 بسيطة — نموذج محلي وليست حماية إنتاجية.
  function hashPassword(text) {
    var value = String(text || "");
    if (!value) return "";
    var hash = 5381;
    for (var i = 0; i < value.length; i += 1) {
      hash = ((hash << 5) + hash + value.charCodeAt(i)) | 0;
    }
    return "h" + (hash >>> 0).toString(36) + value.length;
  }

  function activeUsers() {
    return (state.users || []).filter(function (user) { return user.active !== false; });
  }

  function currentUser() {
    return (state.users || []).find(function (user) { return user.id === state.currentUserId; }) || null;
  }

  function activeAdminCount(excludeId) {
    return activeUsers().filter(function (user) { return user.role === "admin" && user.id !== excludeId; }).length;
  }

  function brandName() {
    return (state.branding && state.branding.name) || "Ice Star";
  }

  function brandMarkHtml() {
    if (state.branding && state.branding.logo && state.branding.logo.dataUrl) {
      return '<img class="brand-logo" src="' + state.branding.logo.dataUrl + '" alt="' + esc(brandName()) + '">';
    }
    var initials = brandName().trim().split(/\s+/).map(function (word) { return word.charAt(0); }).join("").slice(0, 2).toUpperCase() || "IS";
    return '<div class="brand-mark">' + esc(initials) + '</div>';
  }

  function mixHexColors(hexA, hexB, weightB) {
    var parse = function (hex) { return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; };
    var a = parse(hexA);
    var b = parse(hexB);
    return "#" + a.map(function (channel, index) {
      var value = Math.round(channel * (1 - weightB) + b[index] * weightB);
      return Math.max(0, Math.min(255, value)).toString(16).padStart(2, "0");
    }).join("");
  }

  var THEME_VARS = ["--navy-950", "--navy-900", "--navy-800", "--teal-700", "--teal-600", "--teal-100"];

  function applyBranding() {
    var rootStyle = document.documentElement.style;
    var color = (state.branding && state.branding.themeColor) || "";
    if (/^#[0-9a-fA-F]{6}$/.test(color)) {
      rootStyle.setProperty("--navy-900", color);
      rootStyle.setProperty("--navy-950", mixHexColors(color, "#000000", 0.3));
      rootStyle.setProperty("--navy-800", mixHexColors(color, "#ffffff", 0.12));
      rootStyle.setProperty("--teal-700", color);
      rootStyle.setProperty("--teal-600", mixHexColors(color, "#ffffff", 0.12));
      rootStyle.setProperty("--teal-100", mixHexColors(color, "#ffffff", 0.9));
    } else {
      THEME_VARS.forEach(function (name) { rootStyle.removeProperty(name); });
    }
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", /^#[0-9a-fA-F]{6}$/.test(color) ? color : "#103f4a");
    document.title = brandName() + " — EMICP";
  }

  function readBrandingLogo(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type || "")) { showToast("اختر ملف صورة للوغو (PNG أو JPG أو SVG).", "error"); input.value = ""; return; }
    if (file.size > 300 * 1024) { showToast("اللوغو أكبر من 300KB — صغّره ثم أعد الرفع.", "error"); input.value = ""; return; }
    var reader = new FileReader();
    reader.onload = function () {
      state.branding.logo = { name: file.name, type: file.type, dataUrl: String(reader.result) };
      addAudit("تحديث اللوغو (" + file.name + ")", roleName(state.role));
      saveState();
      renderApp();
      showToast("حُفظ اللوغو وأصبح ظاهرًا في الواجهة ولوحة الدخول.", "success");
    };
    reader.onerror = function () { showToast("تعذر قراءة الملف.", "error"); };
    reader.readAsDataURL(file);
  }

  function roleName(key) {
    return roles[key] ? roles[key].name : key;
  }

  function roleOptions(selected) {
    var counts = typeof roleTaskCounts === "function" ? roleTaskCounts() : {};
    return Object.keys(roles).map(function (key) {
      var badge = counts[key] ? " — " + formatNumber(counts[key]) + " " + (counts[key] === 1 ? "مهمة" : "مهام") : "";
      return '<option value="' + key + '"' + (key === selected ? " selected" : "") + '>' + esc(roles[key].name + badge) + '</option>';
    }).join("");
  }

  function allowedPages(role) {
    var assigned = state.permissions[role] || ["home"];
    return pageOrder.filter(function (page) {
      return assigned.indexOf(page) !== -1 && !pageProtectedForRole(role, page);
    });
  }

  function canAccess(page) {
    return allowedPages(state.role).indexOf(page) !== -1;
  }

  function addAudit(text, actor) {
    var stamp = currentTimestamp();
    state.audit.unshift({ time: stamp, actor: actor || roleName(state.role), text: text });
    state.audit = state.audit.slice(0, 200);
    saveState();
  }

  function status(text, tone) {
    return '<span class="status ' + (tone || "") + '">' + esc(text) + '</span>';
  }

  function statusInfo(value) {
    var map = {
      confirmed: ["مؤكد", "green"], submitted: ["مرسل", "blue"], waiting_sales: ["بانتظار المبيعات", "amber"],
      approved: ["معتمد", "green"], needs_revision: ["يحتاج تعديلًا", "red"], available: ["متاح", "green"],
      resolved: ["انحلّت — بانتظار التحقق", "blue"],
      shortage: ["نقص مؤكد", "red"], pending: ["بانتظار القرار", "amber"], verified: ["Verified", "green"],
      blocked: ["Blocked", "red"], exception: ["Exception", "red"], in_transit: ["In Transit", "amber"],
      expected: ["متوقع", "blue"], received: ["مستلم", "blue"], released: ["Released", "green"],
      hold: ["Hold", "amber"], rejected: ["Rejected", "red"], completed: ["مكتمل", "green"],
      open: ["مفتوح", "red"], closed: ["مغلق", "green"], monitoring: ["مراقبة", "amber"], replaced: ["مستبدل", "gray"],
      issued: ["مصروف للإنتاج", "green"], partial: ["استلام جزئي", "amber"], cancelled: ["ملغي", "gray"]
    };
    return map[value] || [value || "—", "gray"];
  }

  function statusByValue(value) {
    var info = statusInfo(value);
    return status(info[0], info[1]);
  }

  // القيمة غير الرقمية كانت تُعرض «0» فتُخفي خطأ الحساب؛ صارت تُعرض «—» ليظهر الخلل بدل أن يُموَّه.
  function formatNumber(value) {
    var number = Number(value);
    if (!Number.isFinite(number)) return "—";
    return number.toLocaleString("en-US");
  }

  // تدوير كميات المخزون: بقايا الفواصل العشرية (1.42e-14) كانت تُجمّد المستند وتولّد نقصًا وهميًا.
  var QTY_EPSILON = 1e-6;

  // ===== كمية الخطة بالكرتون الكامل =====
  // الفوركاست قد يصل بكسور (0.618 كرتون) من التحويل أو التجميع، لكن المصنع لا يُنتج نصف كرتون.
  // كل رقم يدخل خطة (شهرية أو أسبوعية) أو تشغيلًا يُقرَّب إلى كرتون كامل، وأي حاجة أكبر من صفر
  // لا تنزل عن كرتون واحد — وإلا صار في الخطة سطر لا يمكن تنفيذه.
  function planQty(value) {
    var number = Number(value);
    if (!Number.isFinite(number) || number <= 0) return 0;
    return Math.max(1, Math.round(number));
  }

  function roundQty(value) {
    var number = Number(value);
    if (!Number.isFinite(number)) return 0;
    return Math.round(number * 1e6) / 1e6;
  }

  function forecastTotalQty(forecast) {
    return (forecast && forecast.items || []).reduce(function (sum, item) { return sum + Number(item.qty || 0); }, 0);
  }

  function frequencyLabel(value) {
    var labels = { daily: "يومي", weekly: "أسبوعي", monthly: "شهري", custom: "فترة مخصصة" };
    return labels[value] || value || "—";
  }

  function forecastPeriod(forecast) {
    if (!forecast) return "—";
    if (Array.isArray(forecast.months) && forecast.months.length) {
      return forecast.months.length === 1 ? monthLabel(forecast.months[0]) : monthLabel(forecast.months[0]) + " → " + monthLabel(forecast.months[forecast.months.length - 1]) + " (" + forecast.months.length + " أشهر)";
    }
    return forecast.startDate + " → " + forecast.endDate;
  }

  function summary(title, value, copy, tone, icon) {
    return '<article class="summary ' + (tone || "") + '"><div class="summary-top"><span>' + esc(title) + '</span><span class="summary-icon" aria-hidden="true">' + esc(icon) + '</span></div><strong>' + esc(value) + '</strong><small>' + esc(copy) + '</small></article>';
  }

  function pageHead(kicker, title, copy, actions) {
    return '<header class="page-head"><div><span class="eyebrow">' + esc(kicker) + '</span><h1>' + esc(title) + '</h1><p>' + esc(copy) + '</p></div><div class="page-actions">' + (actions || "") + '</div></header>';
  }

  function boundary() {
    return '<div class="role-boundary"><strong>حدود دورك:</strong> ' + esc(roles[state.role].boundary) + '</div>';
  }

  function card(title, copy, body, trailing) {
    return '<article class="card"><div class="card-head"><div><h2>' + esc(title) + '</h2><p>' + esc(copy || "") + '</p></div>' + (trailing || "") + '</div><div class="card-body">' + body + '</div></article>';
  }

  function empty(title, copy, action) {
    return '<div class="empty" role="status"><strong>' + esc(title) + '</strong><p>' + esc(copy) + '</p>' + (action ? '<div class="empty-action">' + action + '</div>' : '') + '</div>';
  }

  // كل الخطوات المستحقة الآن عبر جميع الطلبيات — لا تُخفي طلبية جديدة خطوات طلبية قديمة.
  function activeForecasts() {
    return state.forecasts.filter(function (item) { return item.status !== "cancelled"; });
  }

  function fixedForecasts() {
    return state.forecasts.filter(function (item) { return item.status === "fixed"; });
  }

  // الاحتياجات إجمالية لكل المستند: سجل واحد لكل مادة يجمع كل المنتجات.
  function forecastRequirements(forecastId) {
    return state.materials.filter(function (item) { return item.forecastId === forecastId; });
  }

  function requirementMonthsCell(item) {
    var entries = Object.keys(item.monthlyQty || {}).filter(function (key) { return Number(item.monthlyQty[key]) > 0; }).sort();
    if (!entries.length) return '<time class="need-date">' + esc(item.needDate || "—") + '</time>';
    return entries.map(function (key) { return '<small class="req-po">' + esc(monthLabel(key)) + ': <span class="number">' + formatNumber(item.monthlyQty[key]) + '</span></small>'; }).join("<br>");
  }

  // «لا احتياجات» كان يعني «غير جاهز للأبد»: مستند ثُبِّت بلا مواد فعّالة يعلق بلا أي إجراء يحرّكه.
  function productMaterialsReady(forecastId) {
    var requirements = forecastRequirements(forecastId);
    if (!requirements.length) return !state.rawMaterials.some(function (item) { return item.active !== false; });
    return requirements.every(function (item) {
      return item.stockConfirmed && materialAllocatedAvailable(item) >= effectiveRequired(item);
    });
  }

  function producedQty(forecastId, productCode, month) {
    return state.actuals.filter(function (item) {
      return item.forecastId === forecastId && normalizeCode(item.productCode) === normalizeCode(productCode) && (!month || item.month === month);
    }).reduce(function (sum, item) { return sum + Number(item.actual || 0); }, 0);
  }

  // أزواج (منتج × شهر) الجاهزة لتسجيل الفعلي.
  // includeCompleted: الشهر المكتمل كان يختفي من الجدول فور تسجيله، فلا يرى الإنتاج ما سجّله
  // ولا يكتشف خطأً في الكمية. صار يبقى ظاهرًا مقفلًا بحالة «مكتمل».
  function productionEntries(includeCompleted) {
    var entries = [];
    fixedForecasts().forEach(function (forecast) {
      if (!productMaterialsReady(forecast.id)) return;
      forecast.items.forEach(function (line) {
        forecast.months.forEach(function (month) {
          var planned = Number(line.monthlyQty[month] || 0);
          if (planned <= 0) return;
          // منع التجاوز: لا تشغيل لشهر خطته الأسبوعية غير معتمدة من الإنتاج ومخزن FG.
          if (!weeklyPlanApprovedFor(forecast.id, line.productCode, month)) return;
          var produced = producedQty(forecast.id, line.productCode, month);
          var done = produced >= planQty(planned) - QTY_EPSILON;
          if (done && !includeCompleted) return;
          // التشغيل يُقاس بالكرتون الكامل مثل الخطة، فالمتبقي لا يكون كسرًا لا يُنتَج.
          var plannedWhole = planQty(planned);
          var producedWhole = roundQty(produced);
          entries.push({
            forecast: forecast, line: line, month: month, planned: plannedWhole,
            produced: producedWhole, remaining: Math.max(0, plannedWhole - Math.round(producedWhole)),
            state: done ? "مكتمل" : produced > QTY_EPSILON ? "جزئي" : "لم يبدأ"
          });
        });
      });
    });
    return entries;
  }

  function pendingProductionEntries() {
    return productionEntries(false);
  }

  // النقص يصل مباشرة من المخزن إلى المشتريات — أمر الشراء النهائي قرار المشتريات ولا يُتجاوز.
  // فور تأكيد المخزن للرصيد وظهور نقص، يمكن للمشتريات إصدار أمر الشراء مباشرة — بلا انتظار تثبيت المستند.
  function materialForecastFixed(item) {
    var forecast = state.forecasts.find(function (record) { return record.id === item.forecastId; });
    return Boolean(forecast && forecast.status === "fixed");
  }

  function purchasableShortages() {
    return state.materials.filter(function (item) {
      return item.stockConfirmed && materialShortage(item) > 0;
    });
  }

  // ===== الصافي الزمني للمواد (MRP) =====
  // كان الصافي يُحسب على الإجمالي مقابل رصيد اليوم: احتياج سنة كامل يظهر نقصًا واحدًا يُشترى الآن،
  // فتُجمَّد السيولة وتُخزَّن مواد لها صلاحية شهورًا بلا حاجة. الآن: جدول شهري بترحيل الرصيد.
  function codeMaterialRecords(code) {
    return materialRecordsSameCode(code);
  }

  // الاستهلاك يأكل أقدم الأشهر أولًا، فالمتبقي من كل شهر هو حاجته الحقيقية القادمة.
  function monthlyRequirementForCode(code) {
    var monthly = {};
    codeMaterialRecords(code).forEach(function (item) {
      var consumedLeft = Number(item.consumed || 0);
      Object.keys(item.monthlyQty || {}).sort().forEach(function (month) {
        var qty = Number(item.monthlyQty[month] || 0);
        if (qty <= 0) return;
        var eaten = Math.min(qty, consumedLeft);
        consumedLeft = roundQty(consumedLeft - eaten);
        var net = roundQty(qty - eaten);
        if (net > QTY_EPSILON) monthly[month] = roundQty((monthly[month] || 0) + net);
      });
    });
    return monthly;
  }

  // الوارد المتوقع يُنسب إلى شهر وصوله لا إلى اليوم — هذا ما يجعل الترحيل الشهري صادقًا.
  function monthlyReceiptsForCode(code) {
    var receipts = {};
    state.commitments.forEach(function (commitment) {
      if (commitment.status === "cancelled" || commitment.status === "received") return;
      var linked = state.materials.find(function (item) { return item.id === commitment.materialId; });
      if (!linked || normalizeCode(linked.materialCode) !== normalizeCode(code)) return;
      var month = monthKeyOf(commitment.eta);
      if (!month) return;
      var receipt = state.rawReceipts.find(function (item) { return item.commitmentId === commitment.id; });
      var remaining = roundQty(Number(commitment.qty || 0) - Number(receipt && receipt.received || 0));
      if (remaining <= QTY_EPSILON) return;
      receipts[month] = roundQty((receipts[month] || 0) + remaining);
    });
    return receipts;
  }

  function materialTimePhasedPlan(code) {
    var records = sortedCodeRecords(code);
    var confirmed = records.filter(function (item) { return item.stockConfirmed; });
    var master = rawMasterByCode(code);
    var floor = master && master.strategicStock != null ? Number(master.strategicStock) : 0;
    var monthly = monthlyRequirementForCode(code);
    var receipts = monthlyReceiptsForCode(code);
    var months = [];
    Object.keys(monthly).concat(Object.keys(receipts)).forEach(function (month) {
      if (months.indexOf(month) === -1) months.push(month);
    });
    months.sort();
    var balance = confirmed.length ? materialAvailable(confirmed[0]) : 0;
    var rows = months.map(function (month) {
      var requirement = monthly[month] || 0;
      var arriving = receipts[month] || 0;
      var opening = balance;
      var closing = roundQty(opening + arriving - requirement);
      var net = 0;
      // الرصيد المتوقع لا ينزل تحت المخزون الاستراتيجي في أي فترة؛ الفرق أمر شراء لتلك الفترة.
      if (closing < floor - QTY_EPSILON) { net = roundQty(floor - closing); closing = floor; }
      balance = closing;
      return {
        month: month, opening: opening, receipts: arriving, requirement: requirement,
        closing: closing, net: net, orderBy: latestOrderDate(code, month + "-01")
      };
    });
    return {
      code: code,
      material: records.length ? records[0].material : (master ? master.name : code),
      unit: records.length ? records[0].unit : (master ? master.unit : ""),
      floor: floor,
      confirmed: confirmed.length > 0,
      anchorId: confirmed.length ? confirmed[0].id : (records.length ? records[0].id : ""),
      rows: rows,
      totalNet: roundQty(rows.reduce(function (sum, row) { return sum + row.net; }, 0))
    };
  }

  function confirmedMaterialCodes() {
    var codes = [];
    state.materials.forEach(function (item) {
      if (!item.stockConfirmed) return;
      var code = normalizeCode(item.materialCode);
      if (codes.indexOf(code) === -1) codes.push(code);
    });
    return codes.sort();
  }

  // صفوف الشراء صارت (مادة × شهر حاجة) بدل صف واحد بإجمالي السنة.
  function purchasablePeriods() {
    var out = [];
    confirmedMaterialCodes().forEach(function (code) {
      var plan = materialTimePhasedPlan(code);
      plan.rows.forEach(function (row) {
        if (row.net > QTY_EPSILON) out.push({ plan: plan, row: row });
      });
    });
    return out.sort(function (a, b) {
      return String(a.row.month).localeCompare(String(b.row.month)) || String(a.plan.code).localeCompare(String(b.plan.code));
    });
  }

  // نقطة إعادة الطلب: متوسط الطلب اليومي × مدة التوريد + المخزون الاستراتيجي.
  function reorderPointFor(code) {
    var master = rawMasterByCode(code);
    if (!master || master.leadTimeDays == null) return null;
    var monthly = monthlyRequirementForCode(code);
    var months = Object.keys(monthly);
    if (!months.length) return null;
    var totalNeed = months.reduce(function (sum, month) { return sum + Number(monthly[month] || 0); }, 0);
    var dailyDemand = totalNeed / (months.length * 30);
    var floor = master.strategicStock != null ? Number(master.strategicStock) : 0;
    return roundQty(dailyDemand * Number(master.leadTimeDays) + floor);
  }

  // فحص الجاهزية قبل رد الإنتاج: احتياجات مبدئية + رصيد المخزن + تأكيد المشتريات لإمكانية التوريد.
  function forecastReadiness(forecast) {
    var requirements = forecastRequirements(forecast.id);
    return {
      hasMaterials: requirements.length > 0,
      allConfirmed: requirements.length > 0 && requirements.every(function (item) { return item.stockConfirmed; }),
      supply: forecast.supplyFeasibility || null,
      stale: Boolean(forecast.readinessStale),
      shortageTotal: requirements.reduce(function (sum, item) { return sum + materialShortage(item); }, 0)
    };
  }

  // متى يستطيع الإنتاج الرد على المبيعات؟ بعد اكتمال الفحص — أو مباشرة إن لم تكن هناك مواد معرفة أصلًا.
  function productionReplyAllowed(forecast) {
    if (forecast.status !== "submitted") return false;
    if (!state.rawMaterials.filter(function (item) { return item.active !== false; }).length) return true;
    var readiness = forecastReadiness(forecast);
    return readiness.hasMaterials && readiness.allConfirmed && !!readiness.supply && !readiness.stale;
  }

  // مستندات بانتظار قرار المشتريات: الرصيد مرفوع كاملًا ولا قرار بعد — أو قرار "تعذر" ما زال قابلًا للمراجعة.
  function forecastsAwaitingSupplyConfirm() {

      return readiness.hasMaterials && readiness.allConfirmed && (!readiness.supply || readiness.supply.confirmed === false);
    });
  }

    return steps;
  }

  // مهام الإشعارات: الخطوات المستحقة فعليًا (بدون خطوة الاكتمال الإخبارية).
  function roleTaskSteps(role) {
    return pendingSteps().filter(function (item) { return item.role === role && !item.final; });
  }

  function roleTaskCounts() {
    var counts = {};
    pendingSteps().forEach(function (item) {
      if (item.final) return;
      counts[item.role] = (counts[item.role] || 0) + (Number(item.count) || 1);
    });
    return counts;
  }

  function nextRequiredStep() {
    return pendingSteps()[0];
  }

  // بطاقة الخطوة التالية كانت تعرض لكل دور خطوات الأقسام الأخرى بعناوينها وعدّاداتها —
  // فكانت المبيعات تقرأ عدد المواد الناقصة وعدد الأكواد غير المؤكدة. الآن كل دور يرى مستحقاته.
  function journeySteps() {
    var steps = pendingSteps();
    if (state.role === "admin" || state.role === "executive") return steps;
    return steps.filter(function (item) { return item.role === state.role; });
  }
